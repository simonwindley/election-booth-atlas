# Publishes the site/ folder to GitHub Pages on every push to main (including the election-night feed commits).
name: Publish the Election Booth Atlas
on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/build_pages.py']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Electorate and region pages (/seat/richmond), 404 and sitemap
        run: python3 tools/build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
